AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: KeyRa Phase 1 infrastructure scaffold (FS-062 T-01/T-04)

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment stage used for naming and configuration.

  Org:
    Type: String
    Default: kbx
    Description: Organization prefix used for globally unique resource names.

  StorageBucketName:
    Type: String
    Default: kbx-keyra-dev-local
    Description: Legacy scaffold parameter from T-01 (superseded by StorageBucket resource naming).

  OpenSearchEndpoint:
    Type: String
    Default: https://example-opensearch.local
    Description: OpenSearch endpoint for schema-node indexing and query.

Conditions:
  IsProd: !Equals [!Ref Stage, prod]

Globals:
  Function:
    Runtime: nodejs24.x
    MemorySize: 256
    Timeout: 29
    Environment:
      Variables:
        STAGE: !Ref Stage
        PROJECTS_TABLE: !Ref ProjectsTable
        MAPPINGS_TABLE: !Ref MappingsTable
        SCHEMA_METADATA_TABLE: !Ref SchemaMetadataTable
        SCHEMA_NODES_TABLE: !Ref SchemaNodesTable
        MAPPING_REVISIONS_TABLE: !Ref MappingRevisionsTable
        MAPPING_VERSIONS_TABLE: !Ref MappingVersionsTable
        DEPLOYMENTS_TABLE: !Ref DeploymentsTable
        DEPLOYMENT_CURRENT_TABLE: !Ref DeploymentCurrentTable
        STORAGE_BUCKET: !Ref StorageBucket
        # Compatibility aliases used by existing handlers/tests.
        SCHEMAS_TABLE: !Ref SchemaMetadataTable
        CONTENT_BUCKET: !Ref StorageBucket
        SCHEMA_BUCKET: !Ref StorageBucket
        OPENSEARCH_ENDPOINT: !Ref OpenSearchEndpoint

Resources:
  ProjectsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      TableName: integrations-keyra-projects
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: projectId
          AttributeType: S
      KeySchema:
        - AttributeName: projectId
          KeyType: HASH

  MappingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      TableName: integrations-keyra-mappings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: mappingId
          AttributeType: S
        - AttributeName: projectId
          AttributeType: S
      KeySchema:
        - AttributeName: mappingId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: projectId-index
          KeySchema:
            - AttributeName: projectId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  SchemaMetadataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      TableName: integrations-keyra-schema-metadata
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: schemaId
          AttributeType: S
      KeySchema:
        - AttributeName: schemaId
          KeyType: HASH

  SchemaNodesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      TableName: integrations-keyra-schema-nodes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: schemaId
          AttributeType: S
        - AttributeName: path
          AttributeType: S
        - AttributeName: fieldName
          AttributeType: S
        - AttributeName: schemaIdPath
          AttributeType: S
        - AttributeName: parentPath
          AttributeType: S
      KeySchema:
        - AttributeName: schemaId
          KeyType: HASH
        - AttributeName: path
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: fieldName-index
          KeySchema:
            - AttributeName: fieldName
              KeyType: HASH
            - AttributeName: schemaIdPath
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: parentPath-index
          KeySchema:
            - AttributeName: schemaId
              KeyType: HASH
            - AttributeName: parentPath
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  MappingVersionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      TableName: integrations-keyra-mapping-versions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: mappingId
          AttributeType: S
        - AttributeName: version
          AttributeType: N
      KeySchema:
        - AttributeName: mappingId
          KeyType: HASH
        - AttributeName: version
          KeyType: RANGE

  MappingRevisionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      TableName: integrations-keyra-mapping-revisions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: mappingId
          AttributeType: S
        - AttributeName: revision
          AttributeType: N
      KeySchema:
        - AttributeName: mappingId
          KeyType: HASH
        - AttributeName: revision
          KeyType: RANGE

  DeploymentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      TableName: integrations-keyra-deployments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: mappingId
          AttributeType: S
        - AttributeName: environmentDeployedAt
          AttributeType: S
      KeySchema:
        - AttributeName: mappingId
          KeyType: HASH
        - AttributeName: environmentDeployedAt
          KeyType: RANGE

  DeploymentCurrentTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      TableName: integrations-keyra-deployment-current
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: mappingIdEnvironment
          AttributeType: S
      KeySchema:
        - AttributeName: mappingIdEnvironment
          KeyType: HASH

  StorageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: integrations-keyra
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - DELETE
            AllowedHeaders:
              - Content-Type
              - Authorization
      LifecycleConfiguration:
        Rules:
          - Id: ExpireSchemaBatchArtifacts
            Status: Enabled
            Prefix: schemas/*/batches/
            ExpirationInDays: 7

  KeyraApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub '${Stage}-keyra-api'
      StageName: !Ref Stage
      Cors:
        AllowOrigin: "'*'"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"

  CreateProjectFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: node20
        Sourcemap: true
        External:
          - '@aws-sdk/*'
    Properties:
      FunctionName: kbx-keyra-createproject
      CodeUri: .
      Handler: src/lambda/project/create-project.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectsTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref KeyraApi
            Path: /projects
            Method: post

  ListProjectsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: node20
        Sourcemap: true
        External:
          - '@aws-sdk/*'
    Properties:
      FunctionName: kbx-keyra-listprojects
      CodeUri: .
      Handler: src/lambda/project/list-projects.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ProjectsTable
        - DynamoDBReadPolicy:
            TableName: !Ref MappingsTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref KeyraApi
            Path: /projects
            Method: get

  GetProjectFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: node20
        Sourcemap: true
        External:
          - '@aws-sdk/*'
    Properties:
      FunctionName: kbx-keyra-getproject
      CodeUri: .
      Handler: src/lambda/project/get-project.handler
      MemorySize: 512
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ProjectsTable
        - DynamoDBReadPolicy:
            TableName: !Ref MappingsTable
        - DynamoDBReadPolicy:
            TableName: !Ref SchemaMetadataTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref KeyraApi
            Path: /projects/{id}
            Method: get

  UpdateProjectFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: node20
        Sourcemap: true
        External:
          - '@aws-sdk/*'
    Properties:
      FunctionName: kbx-keyra-updateproject
      CodeUri: .
      Handler: src/lambda/project/update-project.handler
      Policies:
        - DynamoDBCrudPolicy:
