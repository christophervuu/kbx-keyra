  RuntimeBootstrapApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub '${EnvironmentName}-${ServiceName}-api'
      StageName: !Ref ApiStageName

  RuntimeActiveSnapshotsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${EnvironmentName}-${ServiceName}-active-snapshots'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: mappingId
          AttributeType: S
      KeySchema:
        - AttributeName: mappingId
          KeyType: HASH

  RuntimeDeploymentHistoryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${EnvironmentName}-${ServiceName}-deployment-history'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: mappingId
          AttributeType: S
        - AttributeName: eventAt
          AttributeType: S
      KeySchema:
        - AttributeName: mappingId
          KeyType: HASH
        - AttributeName: eventAt
          KeyType: RANGE

  RuntimeArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If
        - HasArtifactsBucketName
        - !Ref ArtifactsBucketName
        - !Sub '${EnvironmentName}-${ServiceName}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  KeyRaDeploymentWriterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-${ServiceName}-deployment-writer'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: RuntimeDeploymentWriterAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: RuntimeActiveSnapshotsWrite
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt RuntimeActiveSnapshotsTable.Arn
              - Sid: RuntimeDeploymentHistoryWrite
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource: !GetAtt RuntimeDeploymentHistoryTable.Arn
              - Sid: RuntimeArtifactsObjectWrite
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${RuntimeArtifactsBucket.Arn}/*'
              - Sid: RuntimeArtifactsBucketList
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt RuntimeArtifactsBucket.Arn

  KeyRaRuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-${ServiceName}-runtime'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: RuntimeReadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: RuntimeActiveSnapshotsRead
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource: !GetAtt RuntimeActiveSnapshotsTable.Arn
              - Sid: RuntimeDeploymentHistoryRead
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource: !GetAtt RuntimeDeploymentHistoryTable.Arn
              - Sid: RuntimeArtifactsObjectRead
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub '${RuntimeArtifactsBucket.Arn}/*'

  KeyRaRuntimeInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-${ServiceName}-runtime-invoke'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - states.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: RuntimeExecuteInvokeOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeRuntimeExecute
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt RuntimeExecuteFunction.Arn
                  - !If
                    - HasRuntimeAccountIdDev
                    - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${RuntimeAccountIdDev}:function:dev-${ServiceName}-execute'
                    - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:dev-${ServiceName}-execute'
                  - !If
                    - HasRuntimeAccountIdPreprod
                    - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${RuntimeAccountIdPreprod}:function:preprod-${ServiceName}-execute'
                    - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:preprod-${ServiceName}-execute'
                  - !If
                    - HasRuntimeAccountIdProd
                    - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${RuntimeAccountIdProd}:function:prod-${ServiceName}-execute'
                    - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:prod-${ServiceName}-execute'

