    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: node20
        Sourcemap: true
        External:
          - '@aws-sdk/*'
    Properties:
      FunctionName: kbx-keyra-rollbackdeployment
      CodeUri: .
      Handler: src/lambda/deployment/rollback-deployment.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MappingsTable
        - DynamoDBReadPolicy:
            TableName: !Ref MappingRevisionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref MappingVersionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DeploymentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DeploymentCurrentTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DeploymentOrchestrationsTable
        - S3CrudPolicy:
            BucketName: !Ref StorageBucket
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref KeyraApi
            Path: /mappings/{mappingId}/rollback
            Method: post

  ListDeploymentsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: node20
        Sourcemap: true
        External:
          - '@aws-sdk/*'
    Properties:
      FunctionName: kbx-keyra-listdeployments
      CodeUri: .
      Handler: src/lambda/deployment/list-deployments.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MappingsTable
        - DynamoDBReadPolicy:
            TableName: !Ref DeploymentsTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref KeyraApi
            Path: /mappings/{mappingId}/deployments
            Method: get

  GetCurrentDeploymentsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: node20
        Sourcemap: true
        External:
          - '@aws-sdk/*'
    Properties:
      FunctionName: kbx-keyra-getcurrentdeployments
      CodeUri: .
      Handler: src/lambda/deployment/get-current-deployments.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MappingsTable
        - DynamoDBReadPolicy:
            TableName: !Ref DeploymentCurrentTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref KeyraApi
            Path: /mappings/{mappingId}/deployments/current
            Method: get

  ExplainRuleFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: node20
        Sourcemap: true
        External:
          - '@aws-sdk/*'
    Properties:
      FunctionName: kbx-keyra-explainrule
      CodeUri: .
      Handler: src/lambda/ai/explain-rule.handler
      Environment:
        Variables:
          PROMPT_REGISTRY_TABLE: !Ref PromptRegistryTableName
          DSL_ASSET_BUCKET: !Ref DslAssetBucketName
          DSL_ASSET_KEY: !Ref DslAssetKey
          GITHUB_MODELS_ENDPOINT: !Ref GitHubModelsEndpoint
          GITHUB_TOKEN: !Ref GitHubToken
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PromptRegistryTableName
        - S3ReadPolicy:
            BucketName: !Ref DslAssetBucketName
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref KeyraApi
            Path: /ai/explain-rule
            Method: post

  SuggestExpressionFunction:
