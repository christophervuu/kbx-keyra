      FunctionName: kbx-keyra-deleteschema
      CodeUri: .
      Handler: src/lambda/schema/delete-schema.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SchemaMetadataTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SchemaNodesTable
        - DynamoDBReadPolicy:
            TableName: !Ref ProjectsTable
        - S3CrudPolicy:
            BucketName: !Ref StorageBucket
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref KeyraApi
            Path: /schemas/{id}
            Method: delete

  QuerySchemaNodesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: node20
        Sourcemap: true
        External:
          - '@aws-sdk/*'
    Properties:
      FunctionName: kbx-keyra-queryschemanodes
      CodeUri: .
      Handler: src/lambda/schema/query-schema-nodes.handler
      MemorySize: 512
      Environment:
        Variables:
          OPENSEARCH_ENDPOINT: !Ref OpenSearchEndpoint
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SchemaMetadataTable
        - DynamoDBReadPolicy:
            TableName: !Ref SchemaNodesTable
        - Statement:
            - Effect: Allow
              Action:
                - aoss:APIAccessAll
              Resource: '*'
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref KeyraApi
            Path: /schemas/{id}/query
            Method: post

  IngestSchemaFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: node20
        Sourcemap: true
        External:
          - '@aws-sdk/*'
    Properties:
      FunctionName: kbx-keyra-ingestschema
      CodeUri: .
      Handler: src/lambda/schema/ingest-schema.handler
      MemorySize: 512
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref SchemaIngestionStateMachine
          INGESTION_STATE_MACHINE_ARN: !Ref SchemaIngestionStateMachine
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SchemaMetadataTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SchemaNodesTable
        - S3CrudPolicy:
            BucketName: !Ref StorageBucket
        - Statement:
            - Effect: Allow
              Action:
                - states:StartExecution
              Resource: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:kbx-keyra-schema-ingestion'
            - Effect: Allow
              Action:
                - aoss:APIAccessAll
              Resource: '*'
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref KeyraApi
            Path: /schemas/ingest
            Method: post

  ProcessBatchFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: node20
        Sourcemap: true
        External:
          - '@aws-sdk/*'
    Properties:
      FunctionName: kbx-keyra-processbatch
      CodeUri: .
      Handler: src/lambda/schema/process-batch.handler
      MemorySize: 512
      Environment:
        Variables:
          SCHEMA_BUCKET: !Ref StorageBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SchemaNodesTable
        - S3CrudPolicy:
            BucketName: !Ref StorageBucket
        - Statement:
            - Effect: Allow
              Action:
                - aoss:APIAccessAll
              Resource: '*'

  OrchestrationTasksFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: node20
        Sourcemap: true
        External:
          - '@aws-sdk/*'
    Properties:
      FunctionName: kbx-keyra-orchestrationtasks
      CodeUri: .
      Handler: src/lambda/schema/orchestration-tasks.handler
      MemorySize: 512
      Environment:
        Variables:
          SCHEMA_BUCKET: !Ref StorageBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SchemaMetadataTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SchemaNodesTable
        - S3CrudPolicy:
            BucketName: !Ref StorageBucket

  SchemaNodesEncryptionPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: kbx-keyra-sn-enc
      Type: encryption
      Description: Encryption policy for schema nodes collection.
      Policy: >-
        {"Rules":[{"ResourceType":"collection","Resource":["collection/integrations-keyra-schema-nodes"]}],"AWSOwnedKey":true}

  SchemaNodesNetworkPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: kbx-keyra-sn-net
      Type: network
      Description: Network policy allowing public access for Phase 1.
      Policy: >-
        [{"Rules":[{"ResourceType":"collection","Resource":["collection/integrations-keyra-schema-nodes"]},{"ResourceType":"dashboard","Resource":["collection/integrations-keyra-schema-nodes"]}],"AllowFromPublic":true}]

  SchemaNodesCollection:
    Type: AWS::OpenSearchServerless::Collection
    DependsOn:
      - SchemaNodesEncryptionPolicy
      - SchemaNodesNetworkPolicy
    Properties:
      Name: integrations-keyra-schema-nodes
      Type: SEARCH
      Description: Schema node index for keyword and structural queries.

  SchemaNodesAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    Properties:
      Name: kbx-keyra-sn-acc
      Type: data
      Description: Data access policy for schema query/index Lambda roles.
      Policy: !Sub
        - >-
          [{"Rules":[{"ResourceType":"collection","Resource":["collection/integrations-keyra-schema-nodes"],"Permission":["aoss:CreateCollectionItems","aoss:UpdateCollectionItems","aoss:DescribeCollectionItems"]},{"ResourceType":"index","Resource":["index/integrations-keyra-schema-nodes/*"],"Permission":["aoss:CreateIndex","aoss:UpdateIndex","aoss:DescribeIndex","aoss:ReadDocument","aoss:WriteDocument"]}],"Principal":["${QuerySchemaNodesFunctionRoleArn}","${IngestSchemaFunctionRoleArn}","${ProcessBatchFunctionRoleArn}","${OrchestrationTasksFunctionRoleArn}"]}]
        - QuerySchemaNodesFunctionRoleArn: !GetAtt QuerySchemaNodesFunctionRole.Arn
          IngestSchemaFunctionRoleArn: !GetAtt IngestSchemaFunctionRole.Arn
          ProcessBatchFunctionRoleArn: !GetAtt ProcessBatchFunctionRole.Arn
          OrchestrationTasksFunctionRoleArn: !GetAtt OrchestrationTasksFunctionRole.Arn

  SchemaIngestionStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: kbx-keyra-schema-ingestion
      DefinitionUri: src/lambda/schema/step-functions/schema-ingestion.asl.json
      DefinitionSubstitutions:
        ProcessBatchFunctionArn: !GetAtt ProcessBatchFunction.Arn
        OrchestrationTasksFunctionArn: !GetAtt OrchestrationTasksFunction.Arn
        StorageBucket: !Ref StorageBucket
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref ProcessBatchFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref OrchestrationTasksFunction
        - S3CrudPolicy:
            BucketName: !Ref StorageBucket

# T-07 will add remaining resources in this section:

Outputs:
  ApiUrl:
    Description: API Gateway invoke URL.
    Value: !Sub 'https://${KeyraApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'

  StorageBucketName:
    Description: Content storage bucket name.
    Value: !Ref StorageBucket

  StorageBucketArn:
    Description: Content storage bucket ARN.
    Value: !GetAtt StorageBucket.Arn

  ProjectsTableArn:
    Description: Projects table ARN.
    Value: !GetAtt ProjectsTable.Arn

  MappingsTableArn:
    Description: Mappings table ARN.
    Value: !GetAtt MappingsTable.Arn

  SchemaMetadataTableArn:
    Description: SchemaMetadata table ARN.
    Value: !GetAtt SchemaMetadataTable.Arn

  SchemaNodesTableArn:
    Description: SchemaNodes table ARN.
    Value: !GetAtt SchemaNodesTable.Arn

  MappingVersionsTableArn:
    Description: MappingVersions table ARN.
    Value: !GetAtt MappingVersionsTable.Arn

  MappingRevisionsTableArn:
    Description: MappingRevisions table ARN.
    Value: !GetAtt MappingRevisionsTable.Arn

  DeploymentsTableArn:
    Description: Deployments table ARN.
