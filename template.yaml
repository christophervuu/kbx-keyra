      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref KeyraApi
            Path: /mappings/{id}
            Method: put

  DeleteMappingFunction:
    Type: AWS::Serverless::Function
    Metadata:
