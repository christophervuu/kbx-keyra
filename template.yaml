          RUNTIME_ARTIFACTS_BUCKET: !Ref RuntimeArtifactsBucket
          SNAPSHOTS_PREFIX: !Ref SnapshotsPrefix
          SCHEMAS_PREFIX: !Ref SchemasPrefix
          ENVIRONMENT_NAME: !Ref EnvironmentName
          LOG_LEVEL: INFO
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RuntimeActiveSnapshotsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RuntimeDeploymentHistoryTable
        - S3CrudPolicy:
            BucketName: !Ref RuntimeArtifactsBucket
      Events:
