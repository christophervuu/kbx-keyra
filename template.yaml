          SCHEMAS_PREFIX: !Ref SchemasPrefix
          ENVIRONMENT_NAME: !Ref EnvironmentName
          LOG_LEVEL: INFO
      Events:
        InternalRollback:
          Type: HttpApi
          Properties:
            ApiId: !Ref RuntimeBootstrapApi
            Path: /internal/rollback
            Method: post

  RuntimeDeployHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${EnvironmentName}-${ServiceName}-deploy'
      RetentionInDays: !Ref LogRetentionDays

  RuntimeExecuteLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${EnvironmentName}-${ServiceName}-execute'
      RetentionInDays: !Ref LogRetentionDays

  RuntimeStatusLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${EnvironmentName}-${ServiceName}-status'
      RetentionInDays: !Ref LogRetentionDays

  RuntimeRollbackLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${EnvironmentName}-${ServiceName}-rollback'
      RetentionInDays: !Ref LogRetentionDays

