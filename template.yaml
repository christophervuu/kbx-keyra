    Properties:
      FunctionName: kbx-keyra-getschema
      CodeUri: .
      Handler: src/lambda/schema/get-schema.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SchemaMetadataTable
        - S3ReadPolicy:
            BucketName: !Ref StorageBucket
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref KeyraApi
            Path: /schemas/{id}
