        - DynamoDBCrudPolicy:
            TableName: !Ref AutoMapTable
        - S3ReadPolicy:
            BucketName: !Ref DslAssetBucketName
        - Statement:
            - Effect: Allow
              Action:
                - states:StartExecution
              Resource:
                - !If
                  - HasAutoMapStepFunctionsArn
                  - !Ref AutoMapStepFunctionsArn
                  - !Ref AWS::NoValue
                - !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:kbx-keyra-auto-map-orchestration'
