          DSL_ASSET_KEY: !Ref DslAssetKey
          GITHUB_MODELS_ENDPOINT: !Ref GitHubModelsEndpoint
          GITHUB_TOKEN: !Ref GitHubToken
          AUTO_MAP_STEP_FUNCTIONS_ARN: !If
            - HasAutoMapStepFunctionsArn
            - !Ref AutoMapStepFunctionsArn
            - !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:kbx-keyra-auto-map-orchestration'
          AUTO_MAP_EXECUTION_MODE: !Ref AutoMapExecutionMode
