      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref KeyraApi
            Path: /mappings/{mappingId}/duplicate
            Method: post

  ListMappingsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: node20
        Sourcemap: true
        External:
          - '@aws-sdk/*'
    Properties:
      FunctionName: kbx-keyra-listmappings
      CodeUri: .
      Handler: src/lambda/mapping/list-mappings.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MappingsTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref KeyraApi
            Path: /projects/{id}/mappings
            Method: get

  ListVersionsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: node20
        Sourcemap: true
        External:
          - '@aws-sdk/*'
    Properties:
      FunctionName: kbx-keyra-listversions
      CodeUri: .
      Handler: src/lambda/mapping/list-versions.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MappingVersionsTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref KeyraApi
            Path: /mappings/{mappingId}/versions
            Method: get

  GetVersionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: node20
        Sourcemap: true
        External:
          - '@aws-sdk/*'
    Properties:
      FunctionName: kbx-keyra-getversion
      CodeUri: .
      Handler: src/lambda/mapping/get-version.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MappingVersionsTable
        - S3ReadPolicy:
            BucketName: !Ref StorageBucket
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref KeyraApi
            Path: /mappings/{mappingId}/versions/{version}
            Method: get

  SaveVersionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: node20
        Sourcemap: true
        External:
          - '@aws-sdk/*'
    Properties:
      FunctionName: kbx-keyra-saveversion
      CodeUri: .
      Handler: src/lambda/mapping/save-version.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MappingVersionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref MappingsTable
        - S3CrudPolicy:
            BucketName: !Ref StorageBucket
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref KeyraApi
            Path: /mappings/{mappingId}/versions
            Method: post

  PreviewMappingFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: node20
        Sourcemap: true
        External:
          - '@aws-sdk/*'
    Properties:
      FunctionName: kbx-keyra-previewmapping
      CodeUri: .
      Handler: src/lambda/mapping/preview-mapping.handler
      MemorySize: 512
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MappingsTable
        - DynamoDBReadPolicy:
            TableName: !Ref DeploymentCurrentTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DeploymentOrchestrationsTable
        - S3ReadPolicy:
            BucketName: !Ref StorageBucket
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref KeyraApi
            Path: /mappings/{mappingId}/preview
            Method: post

  DeployMappingFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: node20
        Sourcemap: true
        External:
          - '@aws-sdk/*'
    Properties:
      FunctionName: kbx-keyra-deploymapping
      CodeUri: .
      Handler: src/lambda/deployment/deploy-mapping.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MappingsTable
        - DynamoDBReadPolicy:
            TableName: !Ref MappingRevisionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref MappingVersionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DeploymentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DeploymentCurrentTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DeploymentOrchestrationsTable
        - S3CrudPolicy:
            BucketName: !Ref StorageBucket
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref KeyraApi
            Path: /mappings/{mappingId}/deploy
            Method: post

  PromoteDeploymentFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: node20
        Sourcemap: true
        External:
          - '@aws-sdk/*'
