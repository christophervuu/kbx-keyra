  QuerySchemaNodesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        External:
        - '@aws-sdk/*'
        Minify: false
        Sourcemap: true
        Target: node20
      SamResourceId: QuerySchemaNodesFunction
    Properties:
      CodeUri: QuerySchemaNodesFunction
      Handler: query-schema-nodes.handler
      MemorySize: 512
      Environment:
        Variables:
          OPENSEARCH_ENDPOINT:
            Ref: OpenSearchEndpoint
          NODE_OPTIONS: ' --enable-source-maps'
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: SchemaMetadataTable
      - DynamoDBReadPolicy:
          TableName:
            Ref: SchemaNodesTable
      - Statement:
        - Effect: Allow
          Action:
          - aoss:APIAccessAll
          Resource: '*'
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: KeyraApi
            Path: /schemas/{id}/query
            Method: post
  IngestSchemaFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        External:
        - '@aws-sdk/*'
        Minify: false
        Sourcemap: true
        Target: node20
      SamResourceId: IngestSchemaFunction
    Properties:
      CodeUri: IngestSchemaFunction
      Handler: ingest-schema.handler
      MemorySize: 512
      Environment:
        Variables:
          STATE_MACHINE_ARN:
            Ref: SchemaIngestionStateMachine
          INGESTION_STATE_MACHINE_ARN:
            Ref: SchemaIngestionStateMachine
          NODE_OPTIONS: ' --enable-source-maps'
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: SchemaMetadataTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: SchemaNodesTable
      - S3CrudPolicy:
          BucketName:
            Ref: StorageBucket
      - Statement:
        - Effect: Allow
          Action:
          - states:StartExecution
          Resource:
            Fn::Sub: arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${Stage}-keyra-schema-ingestion
        - Effect: Allow
          Action:
          - aoss:APIAccessAll
          Resource: '*'
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: KeyraApi
            Path: /schemas/ingest
            Method: post
  ProcessBatchFunction:
