      - DynamoDBCrudPolicy:
          TableName:
            Ref: MappingsTable
      - S3CrudPolicy:
          BucketName:
            Ref: StorageBucket
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: KeyraApi
            Path: /mappings
            Method: post
      Environment:
        Variables:
          NODE_OPTIONS: ' --enable-source-maps'
  GetMappingFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
