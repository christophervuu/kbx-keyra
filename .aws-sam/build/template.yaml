    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        External:
        - '@aws-sdk/*'
        Minify: false
        Sourcemap: true
        Target: node20
      SamResourceId: ProcessBatchFunction
    Properties:
      CodeUri: ProcessBatchFunction
      Handler: process-batch.handler
      MemorySize: 512
      Environment:
        Variables:
          SCHEMA_BUCKET:
            Ref: StorageBucket
          NODE_OPTIONS: ' --enable-source-maps'
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: SchemaNodesTable
      - S3CrudPolicy:
          BucketName:
            Ref: StorageBucket
      - Statement:
        - Effect: Allow
          Action:
          - aoss:APIAccessAll
          Resource: '*'
  OrchestrationTasksFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        External:
        - '@aws-sdk/*'
        Minify: false
        Sourcemap: true
        Target: node20
      SamResourceId: OrchestrationTasksFunction
    Properties:
      CodeUri: OrchestrationTasksFunction
      Handler: orchestration-tasks.handler
      MemorySize: 512
      Environment:
        Variables:
          SCHEMA_BUCKET:
            Ref: StorageBucket
          NODE_OPTIONS: ' --enable-source-maps'
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: SchemaMetadataTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: SchemaNodesTable
      - S3CrudPolicy:
          BucketName:
            Ref: StorageBucket
  SchemaNodesEncryptionPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name:
        Fn::Sub: ${Stage}-keyra-schema-nodes-encryption
      Type: encryption
      Description: Encryption policy for schema nodes collection.
      Policy:
        Fn::Sub: '{"Rules":[{"ResourceType":"collection","Resource":["collection/${Stage}-keyra-schema-nodes"]}],"AWSOwnedKey":true}'
  SchemaNodesNetworkPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name:
        Fn::Sub: ${Stage}-keyra-schema-nodes-network
      Type: network
      Description: Network policy allowing public access for Phase 1.
      Policy:
        Fn::Sub: '[{"Rules":[{"ResourceType":"collection","Resource":["collection/${Stage}-keyra-schema-nodes"]},{"ResourceType":"dashboard","Resource":["collection/${Stage}-keyra-schema-nodes"]}],"AllowFromPublic":true}]'
  SchemaNodesCollection:
    Type: AWS::OpenSearchServerless::Collection
    DependsOn:
    - SchemaNodesEncryptionPolicy
    - SchemaNodesNetworkPolicy
    Properties:
      Name:
        Fn::Sub: ${Stage}-keyra-schema-nodes
      Type: SEARCH
      Description: Schema node index for keyword and structural queries.
  SchemaNodesAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    Properties:
      Name:
        Fn::Sub: ${Stage}-keyra-schema-nodes-access
      Type: data
      Description: Data access policy for schema query/index Lambda roles.
      Policy:
        Fn::Sub:
