AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: KeyRa Phase 1 infrastructure scaffold (FS-062 T-01/T-04)
Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
    - dev
    - staging
    - prod
    Description: Deployment stage used for naming and configuration.
  Org:
    Type: String
    Default: kbx
    Description: Organization prefix used for globally unique resource names.
  StorageBucketName:
    Type: String
    Default: kbx-keyra-dev-local
    Description: Legacy scaffold parameter from T-01 (superseded by StorageBucket
      resource naming).
  OpenSearchEndpoint:
    Type: String
    Default: https://example-opensearch.local
    Description: OpenSearch endpoint for schema-node indexing and query.
Conditions:
  IsProd:
    Fn::Equals:
    - Ref: Stage
    - prod
Globals:
  Function:
    Runtime: nodejs20.x
    MemorySize: 256
    Timeout: 29
    Environment:
      Variables:
        STAGE:
          Ref: Stage
        PROJECTS_TABLE:
          Ref: ProjectsTable
        MAPPINGS_TABLE:
          Ref: MappingsTable
        SCHEMA_METADATA_TABLE:
          Ref: SchemaMetadataTable
        SCHEMA_NODES_TABLE:
          Ref: SchemaNodesTable
        MAPPING_VERSIONS_TABLE:
          Ref: MappingVersionsTable
        STORAGE_BUCKET:
          Ref: StorageBucket
        SCHEMAS_TABLE:
          Ref: SchemaMetadataTable
        CONTENT_BUCKET:
          Ref: StorageBucket
        SCHEMA_BUCKET:
          Ref: StorageBucket
        OPENSEARCH_ENDPOINT:
          Ref: OpenSearchEndpoint
Resources:
  ProjectsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy:
      Fn::If:
      - IsProd
      - Retain
      - Delete
    UpdateReplacePolicy:
      Fn::If:
      - IsProd
      - Retain
      - Delete
    Properties:
      TableName:
        Fn::Sub: ${Stage}-keyra-projects
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: projectId
        AttributeType: S
      KeySchema:
      - AttributeName: projectId
        KeyType: HASH
  MappingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy:
      Fn::If:
      - IsProd
      - Retain
      - Delete
    UpdateReplacePolicy:
      Fn::If:
      - IsProd
      - Retain
      - Delete
    Properties:
      TableName:
        Fn::Sub: ${Stage}-keyra-mappings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: mappingId
        AttributeType: S
      - AttributeName: projectId
        AttributeType: S
      KeySchema:
      - AttributeName: mappingId
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: projectId-index
        KeySchema:
        - AttributeName: projectId
          KeyType: HASH
        Projection:
          ProjectionType: ALL
  SchemaMetadataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy:
      Fn::If:
      - IsProd
      - Retain
      - Delete
    UpdateReplacePolicy:
      Fn::If:
      - IsProd
      - Retain
      - Delete
    Properties:
      TableName:
        Fn::Sub: ${Stage}-keyra-schema-metadata
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: schemaId
        AttributeType: S
      KeySchema:
      - AttributeName: schemaId
        KeyType: HASH
  SchemaNodesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy:
      Fn::If:
      - IsProd
      - Retain
      - Delete
    UpdateReplacePolicy:
      Fn::If:
      - IsProd
      - Retain
      - Delete
    Properties:
      TableName:
        Fn::Sub: ${Stage}-keyra-schema-nodes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: schemaId
        AttributeType: S
      - AttributeName: path
        AttributeType: S
      - AttributeName: fieldName
        AttributeType: S
      - AttributeName: schemaIdPath
        AttributeType: S
      - AttributeName: parentPath
        AttributeType: S
      KeySchema:
      - AttributeName: schemaId
        KeyType: HASH
      - AttributeName: path
        KeyType: RANGE
      GlobalSecondaryIndexes:
      - IndexName: fieldName-index
        KeySchema:
        - AttributeName: fieldName
          KeyType: HASH
        - AttributeName: schemaIdPath
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
      - IndexName: parentPath-index
        KeySchema:
        - AttributeName: schemaId
          KeyType: HASH
        - AttributeName: parentPath
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
  MappingVersionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy:
      Fn::If:
      - IsProd
      - Retain
      - Delete
    UpdateReplacePolicy:
      Fn::If:
      - IsProd
      - Retain
      - Delete
    Properties:
      TableName:
        Fn::Sub: ${Stage}-keyra-mapping-versions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: mappingId
        AttributeType: S
      - AttributeName: version
        AttributeType: N
      KeySchema:
      - AttributeName: mappingId
        KeyType: HASH
      - AttributeName: version
        KeyType: RANGE
  StorageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName:
        Fn::Sub: ${Org}-keyra-${Stage}-${AWS::AccountId}
      CorsConfiguration:
        CorsRules:
        - AllowedOrigins:
          - '*'
          AllowedMethods:
          - GET
          - PUT
          - DELETE
          AllowedHeaders:
          - Content-Type
          - Authorization
      LifecycleConfiguration:
        Rules:
        - Id: ExpireSchemaBatchArtifacts
          Status: Enabled
          Prefix: schemas/*/batches/
          ExpirationInDays: 7
  KeyraApi:
    Type: AWS::Serverless::Api
    Properties:
      Name:
        Fn::Sub: ${Stage}-keyra-api
      StageName:
        Ref: Stage
      Cors:
        AllowOrigin: '''*'''
        AllowMethods: '''GET,POST,PUT,DELETE,OPTIONS'''
        AllowHeaders: '''Content-Type,Authorization'''
  CreateProjectFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        External:
        - '@aws-sdk/*'
        Minify: false
        Sourcemap: true
        Target: node20
      SamResourceId: CreateProjectFunction
    Properties:
      CodeUri: CreateProjectFunction
      Handler: create-project.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ProjectsTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: KeyraApi
            Path: /projects
            Method: post
      Environment:
        Variables:
          NODE_OPTIONS: ' --enable-source-maps'
  ListProjectsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        External:
        - '@aws-sdk/*'
        Minify: false
        Sourcemap: true
        Target: node20
      SamResourceId: ListProjectsFunction
    Properties:
      CodeUri: ListProjectsFunction
      Handler: list-projects.handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: ProjectsTable
      - DynamoDBReadPolicy:
          TableName:
            Ref: MappingsTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: KeyraApi
            Path: /projects
            Method: get
      Environment:
        Variables:
          NODE_OPTIONS: ' --enable-source-maps'
  GetProjectFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        External:
        - '@aws-sdk/*'
        Minify: false
        Sourcemap: true
        Target: node20
      SamResourceId: GetProjectFunction
    Properties:
      CodeUri: GetProjectFunction
      Handler: get-project.handler
      MemorySize: 512
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: ProjectsTable
      - DynamoDBReadPolicy:
          TableName:
            Ref: MappingsTable
      - DynamoDBReadPolicy:
          TableName:
            Ref: SchemaMetadataTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: KeyraApi
            Path: /projects/{id}
            Method: get
      Environment:
        Variables:
          NODE_OPTIONS: ' --enable-source-maps'
  UpdateProjectFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        External:
        - '@aws-sdk/*'
        Minify: false
        Sourcemap: true
        Target: node20
      SamResourceId: UpdateProjectFunction
    Properties:
      CodeUri: UpdateProjectFunction
      Handler: update-project.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ProjectsTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: KeyraApi
            Path: /projects/{id}
            Method: put
      Environment:
        Variables:
          NODE_OPTIONS: ' --enable-source-maps'
  DeleteProjectFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        External:
        - '@aws-sdk/*'
        Minify: false
        Sourcemap: true
        Target: node20
      SamResourceId: DeleteProjectFunction
    Properties:
      CodeUri: DeleteProjectFunction
      Handler: delete-project.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ProjectsTable
      - DynamoDBReadPolicy:
          TableName:
            Ref: MappingsTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: KeyraApi
            Path: /projects/{id}
            Method: delete
      Environment:
        Variables:
          NODE_OPTIONS: ' --enable-source-maps'
  CreateMappingFunction:
    Type: AWS::Serverless::Function
